# The same gate a commit must pass locally, so that "green in CI" and
# "green here" cannot mean two different things. It runs where Wip is
# published; where it is developed, Linux is tested from a Mac with
# scripts/linux.sh instead. Wip is built from the system's seed with the
# runner's own `clang`, as a checkout is built anywhere.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64): the target where ABI
        # assumptions break. ubuntu-latest is x86-64, and is what
        # scripts/linux.sh stands in for locally.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify.sh
