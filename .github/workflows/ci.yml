# The same gate a commit must pass locally, so that "green in CI" and
# "green here" cannot mean two different things. It runs where Wip is
# published; where it is developed, Linux is tested from a Mac with
# scripts/linux.sh instead, and Windows with scripts/windows.sh. Wip is
# built from the system's seed with the runner's own `clang`, as a checkout
# is built anywhere.
name: CI

on:
  # Branches alone: a version's tag is pushed with the commit `main` is
  # pushed to, which is checked once, there.
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64): the target where ABI
        # assumptions break. ubuntu-latest is x86-64, and is what
        # scripts/linux.sh stands in for locally.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify.sh

  windows:
    strategy:
      fail-fast: false
      matrix:
        # Windows on arm64 and on x86-64, each built from its seed with
        # Visual Studio's Clang, which both images have.
        os: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The files as they are written, with no line ending changed: the
      # snapshots and the formatter compare them byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify.ps1
