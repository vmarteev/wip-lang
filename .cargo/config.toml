# On macOS a debug build leaves Rust's debug information in its object
# files, one per codegen unit, beside the binaries, and nothing removes
# them: each rebuild of the compiler leaves some thousands more in
# `target/debug/deps`. `packed` gathers it into a `.dSYM` when a binary is
# linked, and the objects go. Line tables are what a backtrace needs, and
# keep that link quick. Elsewhere the information is in the binary itself.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "split-debuginfo=packed", "-C", "debuginfo=line-tables-only"]
