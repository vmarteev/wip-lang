name = "Wip"
grammar = "wip"
path_suffixes = ["wip"]
line_comments = ["// ", "/// "]
# `wip fmt`'s layout: tabs, shown four wide, and lines up to 100 columns.
hard_tabs = true
tab_size = 4
preferred_line_length = 100
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
