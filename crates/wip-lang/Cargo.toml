[package]
name = "wip-lang"
description = "Compiler prototype for the Wip language"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wip"
path = "src/main.rs"

# Nothing here is documented with examples that run, and every crate pays a
# `rustdoc` run for them otherwise.
[lib]
doctest = false

[dependencies]
wip-syntax.workspace = true
wip-hir.workspace = true
wip-analysis.workspace = true
wip-mir.workspace = true
wip-codegen.workspace = true
wip-llvm.workspace = true
wip-fmt.workspace = true
ariadne.workspace = true
clap.workspace = true
la-arena.workspace = true
mimalloc.workspace = true
serde_json.workspace = true

[dev-dependencies]
datatest-stable.workspace = true
insta.workspace = true

[[test]]
name = "cases"
harness = false
