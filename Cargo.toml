[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vmarteev/wip-lang"

[workspace.dependencies]
wip-syntax = { path = "crates/wip-syntax" }
wip-hir = { path = "crates/wip-hir" }
wip-analysis = { path = "crates/wip-analysis" }
wip-mir = { path = "crates/wip-mir" }
wip-codegen = { path = "crates/wip-codegen" }
wip-llvm = { path = "crates/wip-llvm" }
wip-lang = { path = "crates/wip-lang" }
wip-fmt = { path = "crates/wip-fmt" }

ariadne = "0.6"
clap = { version = "4.6", features = ["derive"] }
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"
cranelift-object = "0.135"
datatest-stable = "0.3"
gimli = { version = "0.33", default-features = false, features = ["read", "write", "std"] }
indexmap = "2.14"
insta = "1.48"
la-arena = "0.3"
lasso = "0.7"
mimalloc = "0.1.52"
object = { version = "0.39", default-features = false, features = ["write", "std", "read_core", "macho"] }
rustc-hash = "2.1"
serde_json = "1.0"
